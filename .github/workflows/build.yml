name: Build LIFE+ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      # ==========================================
      # 3. BUAT PROJECT FLUTTER ANDROID
      # ==========================================
      - name: Buat project Android Flutter
        run: |
          cd /tmp
          flutter create -t app life_template

      # ==========================================
      # 4. SALIN KODE LIFE+
      # ==========================================
      - name: Salin kode LIFE+
        run: |
          rm -rf /tmp/life_template/lib
          cp -r lib /tmp/life_template/lib
          cp pubspec.yaml /tmp/life_template/pubspec.yaml

      # ==========================================
      # 5. ATUR NDK ANDROID
      # ==========================================
      - name: Atur NDK Android
        run: |
          sed -i '/android {/a\    ndkVersion = "27.0.12077973"' \
            /tmp/life_template/android/app/build.gradle.kts

      # ==========================================
      # 6. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        working-directory: /tmp/life_template
        run: |
          flutter pub get

      # ==========================================
      # 7. CEK KODE FLUTTER
      # ==========================================
      - name: Analisis kode LIFE+
        working-directory: /tmp/life_template
        run: |
          flutter analyze

      # ==========================================
      # 8. BUILD APK
      # ==========================================
      - name: Build APK
        working-directory: /tmp/life_template
        run: |
          flutter build apk --release

      # ==========================================
      # 9. SIMPAN APK
      # ==========================================
      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-plus-APK
          path: /tmp/life_template/build/app/outputs/flutter-apk/app-release.apk
