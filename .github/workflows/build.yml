name: Build LIFE+ APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. CHECKOUT PROJECT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. SETUP JAVA
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      # ==========================================
      # 4. CEK FLUTTER
      # ==========================================
      - name: Flutter Doctor
        run: flutter doctor -v

      # ==========================================
      # 5. BUAT TEMPLATE FLUTTER
      # ==========================================
      - name: Create Flutter Template
        run: |
          rm -rf /tmp/life_template

          flutter create \
            --project-name life_template \
            --org com.lifeplus \
            /tmp/life_template

      # ==========================================
      # 6. SALIN KODE APLIKASI LIFE+
      # ==========================================
      - name: Copy LIFE+ Source
        run: |
          rm -rf /tmp/life_template/lib
          cp -r lib /tmp/life_template/lib

          cp pubspec.yaml /tmp/life_template/pubspec.yaml

      # ==========================================
      # 7. MASUK KE PROJECT
      # ==========================================
      - name: Enter Project
        run: |
          cd /tmp/life_template
          pwd
          ls -la
          ls -la lib

      # ==========================================
      # 8. HAPUS TEST BAWAAN FLUTTER
      # ==========================================
      - name: Remove Default Flutter Test
        run: |
          rm -rf /tmp/life_template/test

      # ==========================================
      # 9. SET NDK VERSION
      # ==========================================
      - name: Set Android NDK
        run: |
          cd /tmp/life_template

          if grep -q "ndkVersion" android/app/build.gradle.kts; then
            sed -i 's/ndkVersion = .*/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
          else
            sed -i '/android {/a\    ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
          fi

          echo "=== NDK CONFIG ==="
          grep -n "ndkVersion" android/app/build.gradle.kts || true

      # ==========================================
      # 10. PUB GET
      # ==========================================
      - name: Flutter Pub Get
        working-directory: /tmp/life_template
        run: flutter pub get

      # ==========================================
      # 11. ANALYZE
      # ==========================================
      - name: Flutter Analyze
        working-directory: /tmp/life_template
        run: flutter analyze

      # ==========================================
      # 12. BUILD APK RELEASE
      # ==========================================
      - name: Build APK
        working-directory: /tmp/life_template
        run: flutter build apk --release

      # ==========================================
      # 13. CEK HASIL APK
      # ==========================================
      - name: Check APK
        run: |
          ls -lh /tmp/life_template/build/app/outputs/flutter-apk/
          test -f /tmp/life_template/build/app/outputs/flutter-apk/app-release.apk

      # ==========================================
      # 14. UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFE-plus-release
          path: /tmp/life_template/build/app/outputs/flutter-apk/app-release.apk
